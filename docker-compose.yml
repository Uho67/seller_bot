services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flow_bot
    restart: unless-stopped
    ports:
      - "3007:3007"
    volumes:
      - ./backend/data:/app/data
      - ./backend/backups:/app/backups
      - ./backend/uploads:/app/uploads
    env_file:
      - ./backend/.env
