services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lunvo_new
    restart: unless-stopped
    ports:
      - "3004:3004"
    volumes:
      - ./backend/data:/app/data
      - ./backend/backups:/app/backups
      - ./backend/uploads:/app/uploads
    env_file:
      - ./backend/.env
