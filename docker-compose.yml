services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: smoke
    container_name: smoke
    restart: unless-stopped
    ports:
      - "3011:3011"
    volumes:
      - ./backend/data:/app/data
      - ./backend/backups:/app/backups
      - ./backend/uploads:/app/uploads
    env_file:
      - ./backend/.env
