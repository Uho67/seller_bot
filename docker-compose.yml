services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_BASE_PATH: /uds2_badmin
    container_name: ${CONTAINER_NAME:-aromavawe}
    restart: unless-stopped
    ports:
      - "${PORT:-3010}:${PORT:-3010}"
    volumes:
      - ./backend/data:/app/data
      - ./backend/backups:/app/backups
      - ./backend/uploads:/app/uploads
    env_file:
      - ./backend/.env
