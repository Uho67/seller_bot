services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_BASE_PATH: /steam_bot
    container_name: steam_bot
    restart: unless-stopped
    ports:
      - "3006:3006"
    volumes:
      - ./backend/data:/app/data
      - ./backend/backups:/app/backups
      - ./backend/uploads:/app/uploads
    env_file:
      - ./backend/.env
